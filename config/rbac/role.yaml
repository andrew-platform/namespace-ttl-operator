---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - infra.example.com
  resources:
  - temporarynamespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.example.com
  resources:
  - temporarynamespaces/finalizers
  verbs:
  - update
- apiGroups:
  - infra.example.com
  resources:
  - temporarynamespaces/status
  verbs:
  - get
  - patch
  - update
